name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tax engine tests
        run: node --test tests/tax.test.js tests/tax-v2.test.js tests/lifesim.test.js tests/deposit.test.js tests/loan.test.js
      - name: Build site
        run: node scripts/build.js
      - name: Check SEO tags, links and structured data
        run: node scripts/check.js
      - name: Browser smoke tests
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node --test tests/smoke.test.js
