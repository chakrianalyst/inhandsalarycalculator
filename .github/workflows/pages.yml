# Publishes the site to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/tax.test.js tests/tax-v2.test.js tests/lifesim.test.js tests/deposit.test.js tests/loan.test.js tests/invest.test.js tests/gratuity.test.js tests/hra.test.js tests/fire.test.js tests/rentbuy.test.js tests/abroad.test.js tests/returning.test.js
      - run: node scripts/build.js
      - run: node scripts/check.js          # a broken build never gets published
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
